name: hol-guard-pre-tool
description: HOL_GUARD_PRE_TOOL_USE
enabled: true
priority: 100

trigger:
  type: PRE_TOOL_USE
  tools:
    - BashTool

execution:
  type: script
  async: false
  failClosed: true
  timeout: 10
  script: |
    set -u
    # Pin both executables before moving into the agent-controlled Bash cwd.
    # Relative PATH hits can be rebound after cd, so fail closed on them.
    PYTHON_BIN=$(command -v python3 2>/dev/null) || exit 2
    GUARD_BIN=$(command -v hol-guard 2>/dev/null) || exit 2
    case "$PYTHON_BIN" in /*) ;; *) exit 2 ;; esac
    case "$GUARD_BIN" in /*) ;; *) exit 2 ;; esac
    # Read stdin directly: Bash command substitution silently drops raw NULs.
    COMMAND_FILE=$(mktemp)
    STDOUT_FILE=$(mktemp)
    STDERR_FILE=$(mktemp)
    trap 'rm -f "$COMMAND_FILE" "$STDOUT_FILE" "$STDERR_FILE"' EXIT

    if ! "$PYTHON_BIN" -c '
    import json
    import sys

    # Duplicate input keys are ambiguous between JSON consumers. Deny rather
    # than inspect a different command than the actual Bash executor.
    def reject_duplicate_keys(pairs):
        result = {}
        for key, value in pairs:
            if key in result:
                raise SystemExit(2)
            result[key] = value
        return result

    payload = json.load(sys.stdin, object_pairs_hook=reject_duplicate_keys)
    tool_input = payload.get("tool_input")
    if not isinstance(tool_input, dict):
        raise SystemExit(2)
    command = tool_input.get("command")
    if not isinstance(command, str) or not command.strip() or "\x00" in command:
        raise SystemExit(2)
    sys.stdout.write(command)
    ' >"$COMMAND_FILE"; then
      exit 2
    fi

    # Append a sentinel so command substitution preserves trailing newlines.
    COMMAND=$(cat "$COMMAND_FILE"; printf ".")
    COMMAND=${COMMAND%.}
    # BashTool executes from the JVM process directory, while hook scripts
    # normally start from HookContext.workDir. Scan the same filesystem root
    # BashTool will execute in, or block if the trusted root is unavailable.
    if [ -z "${JIMI_BASH_EXEC_CWD:-}" ] || [ ! -d "$JIMI_BASH_EXEC_CWD" ]; then
      exit 2
    fi
    cd "$JIMI_BASH_EXEC_CWD" || exit 2
    if ! "$GUARD_BIN" command test --json -- "$COMMAND" >"$STDOUT_FILE" 2>"$STDERR_FILE"; then
      cat "$STDERR_FILE" >&2
      exit 2
    fi

    MINIMUM_ACTION=$("$PYTHON_BIN" - "$STDOUT_FILE" <<'PY'
    import json
    import sys

    with open(sys.argv[1], encoding="utf-8") as response_file:
        raw = response_file.read().strip()
    def reject_duplicate_keys(pairs):
        # A later allow must not overwrite an earlier deny/review value.
        result = {}
        for key, value in pairs:
            if key in result:
                raise ValueError("duplicate JSON key in Guard response")
            result[key] = value
        return result

    try:
        # Only one complete unambiguous JSON document may authorize a tool.
        # Reject duplicate keys in both top-level and nested verdicts.
        payload = json.loads(raw, object_pairs_hook=reject_duplicate_keys)
    except (json.JSONDecodeError, ValueError):
        payload = None

    if not isinstance(payload, dict):
        print("deny")
        raise SystemExit

    classification = payload.get("classification")
    explicitly_benign = (
        isinstance(classification, dict)
        and classification.get("explicitly_benign") is True
    )
    action = str(payload.get("minimum_action") or "unknown").strip().lower()
    decision = payload.get("decision")
    explicit_stop = "continue" in payload and payload["continue"] is not True
    conflicting_decision = "decision" in payload and (
        not isinstance(decision, str) or decision.strip().lower() != "allow"
    )
    # Optional hook-level decisions cannot override an explicit Guard stop.
    policy_action = payload.get("policy_action")
    conflicting_policy = "policy_action" in payload and policy_action not in {"allow", "not_run"}
    hook = payload.get("hookSpecificOutput")
    conflicting_hook = "hookSpecificOutput" in payload and (
        not isinstance(hook, dict)
        or hook.get("permissionDecision") != "allow"
        or hook.get("hookEventName") != "PreToolUse"
    )
    print(
        "allow" if explicitly_benign and action == "allow"
        and not explicit_stop and not conflicting_decision
        and not conflicting_policy and not conflicting_hook else "deny"
    )
    PY
    )

    case "$MINIMUM_ACTION" in
      allow) exit 0 ;;
      *)
        cat "$STDOUT_FILE" >&2
        exit 2
        ;;
    esac
