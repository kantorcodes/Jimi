name: hol-guard-pre-tool
description: HOL_GUARD_PRE_TOOL_USE
enabled: true
priority: 100

trigger:
  type: PRE_TOOL_USE
  tools:
    - BashTool

execution:
  type: script
  async: false
  timeout: 10
  script: |
    set -u
    INPUT=$(cat)
    COMMAND_FILE=$(mktemp)
    STDOUT_FILE=$(mktemp)
    STDERR_FILE=$(mktemp)
    trap 'rm -f "$COMMAND_FILE" "$STDOUT_FILE" "$STDERR_FILE"' EXIT

    if ! printf '%s' "$INPUT" | python3 -c '
    import json
    import sys

    payload = json.load(sys.stdin)
    tool_input = payload.get("tool_input")
    if not isinstance(tool_input, dict):
        raise SystemExit(2)
    command = tool_input.get("command")
    if not isinstance(command, str) or not command.strip():
        raise SystemExit(2)
    sys.stdout.write(command)
    ' >"$COMMAND_FILE"; then
      exit 2
    fi

    # Append a sentinel so command substitution preserves trailing newlines.
    COMMAND=$(cat "$COMMAND_FILE"; printf ".")
    COMMAND=${COMMAND%.}
    if ! hol-guard command test --json -- "$COMMAND" >"$STDOUT_FILE" 2>"$STDERR_FILE"; then
      cat "$STDERR_FILE" >&2
      exit 2
    fi

    MINIMUM_ACTION=$(python3 - "$STDOUT_FILE" <<'PY'
    import json
    import sys

    lines = [line.strip() for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
    payload = None
    for line in reversed(lines):
        try:
            value = json.loads(line)
        except json.JSONDecodeError:
            continue
        if isinstance(value, dict):
            payload = value
            break

    if payload is None:
        print("deny")
        raise SystemExit

    classification = payload.get("classification")
    explicitly_benign = (
        isinstance(classification, dict)
        and classification.get("explicitly_benign") is True
    )
    action = str(payload.get("minimum_action") or "unknown").strip().lower()
    decision = payload.get("decision")
    explicit_stop = "continue" in payload and payload["continue"] is not True
    conflicting_decision = decision is not None and (
        not isinstance(decision, str) or decision.strip().lower() != "allow"
    )
    # Optional hook-level decisions cannot override an explicit Guard stop.
    policy_action = payload.get("policy_action")
    conflicting_policy = policy_action is not None and policy_action != "allow"
    hook = payload.get("hookSpecificOutput")
    conflicting_hook = hook is not None and (
        not isinstance(hook, dict) or hook.get("permissionDecision") != "allow"
    )
    print(
        "allow" if explicitly_benign and action == "allow"
        and not explicit_stop and not conflicting_decision
        and not conflicting_policy and not conflicting_hook else "deny"
    )
    PY
    )

    case "$MINIMUM_ACTION" in
      allow) exit 0 ;;
      *)
        cat "$STDOUT_FILE" >&2
        exit 2
        ;;
    esac
