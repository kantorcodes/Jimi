# ==================== Jimi 配置文件 ====================
# 所有配置项的详细说明和默认值
# 用户可复制此文件到 ~/.jimi/config.yml 进行自定义配置

# ==================== 基础配置 ====================

# 默认使用的模型名称，必须在 models 中定义
default_model: qwen3.5-plus

# ==================== LLM 提供商配置 ====================

providers:
  # 阿里通义千问配置
  qwen:
    type: qwen
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: YOUR_API_KEY_HERE  # 请替换为您的 API Key
    custom_headers: { }
    rate_limit:
      window_ms: 4000      # 时间窗口（毫秒）
      max_requests: 4      # 窗口内最大请求数
      sleep_ms: 3000       # 超限后等待时间（毫秒）

  # Ollama 本地模型配置
  ollama:
    type: ollama
    base_url: http://localhost:11434/v1
    api_key: ""  # Ollama 通常不需要 API Key
    custom_headers: { }

  # Kimi (Moonshot) 配置
  kimi:
    type: kimi
    base_url: https://api.moonshot.cn/v1
    api_key: YOUR_API_KEY_HERE
    custom_headers: { }
    rate_limit:
      window_ms: 60000
      max_requests: 10
      sleep_ms: 1000

  # 智谱 GLM 配置
  glm:
    type: glm
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key: YOUR_API_KEY_HERE
    custom_headers: { }
    rate_limit:
      window_ms: 60000
      max_requests: 20
      sleep_ms: 1000

  # MiniMax 配置
  minimax:
    type: minimax
    base_url: https://api.minimaxi.com/v1
    api_key: YOUR_API_KEY_HERE
    custom_headers: { }
    rate_limit:
      window_ms: 60000
      max_requests: 30
      sleep_ms: 1000

# ==================== 模型配置 ====================

models:
  # 通义千问系列
  qwen3-max:
    provider: qwen              # 使用的提供商（必须在 providers 中定义）
    model: qwen3-max            # 模型名称
    max_context_size: 200000    # 最大上下文长度（Token）

  qwen3-next-80b-a3b-thinking:
    provider: qwen
    model: qwen3-next-80b-a3b-thinking
    max_context_size: 200000

  qwen3-next-80b-a3b-instruct:
    provider: qwen
    model: qwen3-next-80b-a3b-instruct
    max_context_size: 200000

  qwen3.5-plus:
    provider: qwen
    model: qwen3.5-plus
    max_context_size: 200000

  # Kimi 系列
  kimi-k2-thinking-turbo:
    provider: kimi
    model: kimi-k2-thinking-turbo
    max_context_size: 200000

  kimi-k2-instruct:
    provider: kimi
    model: kimi-k2-instruct
    max_context_size: 200000

  # 智谱 GLM 系列
  glm-4.7:
    provider: glm
    model: glm-4.7
    max_context_size: 200000

  # MiniMax 系列
  minimax-m2.1:
    provider: minimax
    model: MiniMax-M2.1
    max_context_size: 200000

  # Ollama 本地模型
  qwen3:4b-instruct-2507-q8_0:
    provider: ollama
    model: qwen3:4b-instruct-2507-q8_0
    max_context_size: 100000

  qwen3:4b-thinking-2507-q8_0:
    provider: ollama
    model: qwen3:4b-thinking-2507-q8_0
    max_context_size: 100000

# ==================== 循环控制配置 ====================

loop_control:
  max_steps_per_run: 200    # 单次运行最大步数
  max_retries_per_step: 3   # 单步最大重试次数

# ==================== Web 搜索配置 ====================

web_search:
  base_url: https://api.bochaai.com/v1/web-search
  api_key: YOUR_API_KEY_HERE
  custom_headers: { }

# ==================== 记忆模块配置 ====================

memory:
  enabled: true                       # 是否启用记忆系统
  storage_path: ""                    # 记忆存储路径（为空则使用默认 ~/.jimi/memory/{dirHash}）
  max_memory_tokens: 2000             # MEMORY.md 最大 Token 数限制
  auto_extract: true                  # 是否自动从每轮对话中提取记忆
  auto_consolidate: true              # 是否自动整理记忆（autoDream）
  consolidate_min_sessions: 5         # 自动整理触发条件：最少会话数
  consolidate_min_hours: 24           # 自动整理触发条件：最少间隔小时数

# ==================== MetaTool 配置 ====================

meta_tool:
  enabled: true                # 是否启用 MetaTool（编程式工具调用）
  max_execution_time: 30       # 最大执行时间（秒）
  max_code_length: 10000       # 最大代码长度（字符）
  log_execution_details: true  # 是否记录执行详情

# ==================== 工具输出配置 ====================

# 工具大输出落盘：超过阈值的成功输出写入 .jimi/tool-output/，
# 上下文仅保留摘要 + 预览 + 文件路径，避免大输出加速触发有损压缩。
tool_output:
  max_inline_chars: 32000      # 内联到上下文的最大字符数，0 表示禁用落盘
  preview_chars: 2000          # 落盘后仍保留在上下文中的预览字符数

# ==================== 自我改进配置 ====================

# refine 会读取执行轨迹，对 harness 补充层（prompt notes / 记忆 / 技能）做最小增量修改。
# 这是有实证风险的能力：自我修改若缺少审计与回滚会退化为不可控漂移，故默认关闭。
# 开启前请确认 /harness log 与 /harness revert 可用。
refine:
  enabled: false                   # 是否启用自我改进
  trigger_on_verify_failures: 2    # 目标验证连续失败达到该次数时触发，0 表示禁用该触发点
  trigger_on_success: false        # 任务成功后是否触发（沉淀可复用战术）
  trajectory_window: 40            # 分析时读取的最近历史消息条数
  model: ""                        # 使用的模型，为空则回退默认模型

# ==================== 子 Agent 编排配置 ====================

# 异步子 Agent（SubAgentTool mode=async）的并发闸门。
# 与 ToolDispatcher 的单批并发度解耦：异步子 Agent 在工具返回后仍在后台运行。
subagent:
  max_concurrent: 4      # 同时后台运行的子 Agent 上限，额度耗尽时自动降级为同步
  max_retained_runs: 64  # 内存中保留的运行记录上限（进程重启即丢）

# ==================== 沙箱配置 ====================

sandbox:
  enabled: false                # 是否启用沙箱机制（默认关闭）
  mode: RESTRICTED              # 沙箱模式：STRICT（严格）/RESTRICTED（受限）/PERMISSIVE（宽松）

  # 文件系统限制配置
  filesystem:
    allow_write_outside_workspace: false  # 是否允许在工作区外写入
    denied_paths: # 禁止访问的路径（支持 glob 模式）
      - "/etc/**"
      - "/usr/**"
      - "/System/**"
      - "**/.ssh/**"
      - "**/.aws/**"
      - "**/.kube/**"
    max_file_size: 10485760       # 最大文件大小（字节，默认 10MB）

  # Shell 命令限制配置
  shell:
    dangerous_patterns: # 危险命令模式（支持正则表达式）
      - "rm -rf"
      - ":(){ :|:& };:"            # fork 炸弹
      - "dd if="
      - "> /dev/sda"
      - "mkfs\\."
      - "chmod -R 777"
    allowed_commands: [ ]          # 白名单命令（如果为空，则使用黑名单模式）

  # 网络访问限制配置
  network:
    denied_domains: # 禁止访问的域名
      - "169.254.169.254"          # AWS metadata endpoint
      - "metadata.google.internal"  # GCP metadata endpoint
      - "100.100.100.200"          # 阿里云 metadata endpoint

# ==================== Shell UI 配置 ====================

shell_ui:
  # 显示配置
  show_spinner: true                    # 是否显示进度指示器（旋转动画）
  show_token_usage: false               # 是否显示 Token 消耗统计
  tool_display_mode: minimal            # 工具调用显示模式：full/compact/minimal
  tool_args_truncate_length: 100        # 工具参数截断长度（紧凑模式下）
  
  # 旋转动画配置
  spinner_type: dots                    # 旋转动画类型：dots/arrows/circles
  spinner_interval_ms: 100              # 旋转动画更新间隔（毫秒）
  
  # 提示符配置
  # - simple: 简洁模式，只有图标和名称
  # - normal: 标准模式，显示图标、名称和状态
  # - rich: 丰富模式，显示图标、名称、状态、消息数和 Token 数
  prompt_style: normal                  # 提示符样式：simple/normal/rich
  show_time_in_prompt: false            # 是否在提示符中显示时间
  show_context_stats: false             # 是否在提示符中显示上下文统计
  
  # 快捷提示配置
  show_shortcuts_hint: true             # 是否显示快捷操作提示
  shortcuts_hint_frequency: first_time  # 快捷提示显示频率：always/first_time/periodic
  shortcuts_hint_interval: 10           # 定期显示的间隔（交互次数）
  
  # 主题与通知配置
  theme_name: default                   # 主题名称
  enable_desktop_notification: true     # 是否启用桌面通知
  enable_notification_sound: true       # 是否启用终端提示音
